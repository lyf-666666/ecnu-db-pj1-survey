<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑问卷 - 问卷调查系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/dashboard.html">问卷<span>系统</span></a>
    <div class="right">
      <a href="/dashboard.html">我的问卷</a>
      <a href="/questions">题目库</a>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
        <div>
          <h1 id="survey-title">加载中...</h1>
          <div class="muted" id="survey-meta"></div>
        </div>
        <span id="survey-status" class="badge draft">草稿</span>
      </div>

      <div id="share-box" style="margin-top:12px;" hidden>
        <div class="muted">填写链接（填写的人需要先登录）：</div>
        <div class="share-link" id="share-link"></div>
        <button type="button" class="secondary" id="copy-link" style="margin-top:8px;">复制链接</button>
      </div>

      <details style="margin-top:16px;">
        <summary style="cursor:pointer;font-size:14px;">修改问卷信息</summary>
        <form id="info-form" style="margin-top:14px;">
          <div class="field">
            <label>问卷标题</label>
            <input type="text" name="title" maxlength="80" required>
          </div>
          <div class="field">
            <label>问卷说明</label>
            <textarea name="description" maxlength="1000"></textarea>
          </div>
          <div class="row">
            <div class="field">
              <label>截止时间（留空表示不限）</label>
              <input type="datetime-local" name="deadline">
            </div>
            <div class="field">
              <label>填写设置</label>
              <label style="font-weight:normal;">
                <input type="checkbox" name="allowAnonymous"> 允许匿名填写
              </label>
            </div>
          </div>
          <button type="submit">保存问卷信息</button>
          <span id="info-msg" class="error"></span>
        </form>
      </details>

      <div class="actions" style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" id="publish-btn">发布问卷</button>
        <button type="button" class="secondary" id="close-btn">关闭问卷</button>
        <a id="stats-link" href="#" hidden>查看统计</a>
      </div>
      <div id="action-msg" class="error"></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
        <h2 style="margin:0;">题目列表</h2>
        <div style="display:flex;gap:8px;">
          <button type="button" class="secondary" id="pick-question-btn">从题库添加</button>
          <button type="button" id="new-question-btn">添加题目</button>
        </div>
      </div>
      <div id="lock-hint" class="hint" hidden>问卷已经发布，题目不能再修改。需要换题目的话，只能新建一份问卷。</div>
      <div id="question-list" style="margin-top:14px;"><div class="empty">加载中...</div></div>
    </div>

    <div class="card" id="picker-card" hidden>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
        <h2 style="margin:0;">从题库添加</h2>
        <button type="button" class="secondary" id="close-picker">收起</button>
      </div>
      <div class="hint" style="margin-top:6px;">选一个版本加进这份问卷。加进来之后，题库再改也不会影响这里。</div>
      <div class="row" style="margin-top:12px;">
        <div class="field" style="flex:2;">
          <input type="text" id="picker-search" placeholder="搜索题目">
        </div>
        <div class="field" style="flex:1;">
          <select id="picker-scope">
            <option value="mine">我的题目</option>
            <option value="shared">共享给我</option>
          </select>
        </div>
      </div>
      <div id="picker-list"><div class="empty">加载中...</div></div>
    </div>

    <div class="card" id="editor-card" hidden>
      <h2 id="editor-title">添加题目</h2>
      <form id="question-form">
        <div class="row">
          <div class="field">
            <label>题型</label>
            <select name="type" id="type-select">
              <option value="single">单选题</option>
              <option value="multiple">多选题</option>
              <option value="text">文本填空</option>
              <option value="number">数字填空</option>
            </select>
          </div>
          <div class="field" style="flex:2;">
            <label>题目</label>
            <input type="text" name="title" maxlength="200" required placeholder="例如：你的性别">
          </div>
        </div>

        <div class="field">
          <label style="font-weight:normal;">
            <input type="checkbox" name="required" checked> 必答题
          </label>
        </div>

        <div id="options-box">
          <label>选项</label>
          <div id="option-rows"></div>
          <button type="button" class="secondary" id="add-option">增加选项</button>
          <div class="hint">编号用于跳转规则，修改选项文字不影响编号。</div>
        </div>

        <div id="multiple-box" class="row" hidden>
          <div class="field">
            <label>最少选择数量（留空不限）</label>
            <input type="number" name="minSelect" min="0" step="1">
          </div>
          <div class="field">
            <label>最多选择数量（留空不限）</label>
            <input type="number" name="maxSelect" min="0" step="1">
          </div>
        </div>

        <div id="text-box" class="row" hidden>
          <div class="field">
            <label>最少字数（留空不限）</label>
            <input type="number" name="minLength" min="0" step="1">
          </div>
          <div class="field">
            <label>最多字数（留空不限）</label>
            <input type="number" name="maxLength" min="0" step="1">
          </div>
        </div>

        <div id="number-box" class="row" hidden>
          <div class="field">
            <label>最小值（留空不限）</label>
            <input type="number" name="min" step="any">
          </div>
          <div class="field">
            <label>最大值（留空不限）</label>
            <input type="number" name="max" step="any">
          </div>
          <div class="field">
            <label>数值要求</label>
            <label style="font-weight:normal;">
              <input type="checkbox" name="integer"> 必须是整数
            </label>
          </div>
        </div>

        <div id="jumps-box" hidden>
          <label>跳转规则</label>
          <div class="hint" style="margin-top:0;">当本题满足条件时，直接跳到指定题目；不满足任何规则则按顺序进入下一题。</div>
          <div id="jump-rows"></div>
          <button type="button" class="secondary" id="add-jump">添加跳转规则</button>
        </div>

        <div style="margin-top:18px;">
          <button type="submit" id="save-question">保存题目</button>
          <button type="button" class="secondary" id="cancel-edit" hidden>取消编辑</button>
          <span id="question-msg" class="error"></span>
        </div>
        <div class="hint" id="version-hint" hidden>这道题已经进入题库。保存修改会生成一个新版本，其他问卷仍然用它们自己的旧版本。</div>
      </form>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/edit.js"></script>
</body>
</html>
