<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>题目库 - 问卷调查系统</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .q-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .q-title { font-weight: 500; }
    .q-item .ops { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .version-item { border-left: 3px solid var(--line); padding: 8px 0 8px 12px; margin-bottom: 4px; }
    .version-item.current { border-left-color: var(--primary); background: #f8fbff; }
    .version-title { font-size: 14px; }
    .version-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
    .bank-chip { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 999px; padding: 2px 10px; font-size: 12px; margin: 0 6px 6px 0; }
    .sub-block { margin-top: 18px; }
    .sub-block h3 { font-size: 14px; margin: 0 0 8px; }
    .inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
    .inline-form .field { margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/dashboard.html">问卷<span>系统</span></a>
    <div class="right">
      <span id="username" class="muted"></span>
      <a href="/dashboard.html">我的问卷</a>
      <a href="/questions" style="font-weight:600;">题目库</a>
      <button type="button" class="link" id="logout">退出</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div class="q-head">
        <div>
          <h2 style="margin:0;">题目库</h2>
          <div class="muted" style="margin-top:6px;">题目可以重复使用。修改会自动生成新版本，已经用过的旧版本不会变。</div>
        </div>
        <button type="button" id="new-question">新建题目</button>
      </div>

      <div class="tabs" style="margin-top:18px;">
        <button type="button" data-scope="mine" class="active">我的题目</button>
        <button type="button" data-scope="shared">共享给我</button>
      </div>

      <div class="row">
        <div class="field" style="flex:2;">
          <input type="text" id="search" placeholder="按题目内容搜索">
        </div>
        <div class="field" style="flex:1;">
          <select id="bank-filter">
            <option value="">全部题库</option>
          </select>
        </div>
      </div>

      <div id="question-list"><div class="empty">加载中...</div></div>
    </div>

    <div class="card" id="editor-card" hidden>
      <div class="q-head">
        <h2 id="editor-title" style="margin:0;">新建题目</h2>
        <button type="button" class="secondary" id="cancel-edit">收起</button>
      </div>
      <div class="hint" id="editor-hint" style="margin-bottom:12px;"></div>

      <form id="question-form">
        <div class="row">
          <div class="field">
            <label>题型</label>
            <select name="type" id="type-select">
              <option value="single">单选题</option>
              <option value="multiple">多选题</option>
              <option value="text">文本填空</option>
              <option value="number">数字填空</option>
            </select>
          </div>
          <div class="field" style="flex:2;">
            <label>题目</label>
            <input type="text" name="title" maxlength="200" required placeholder="例如：你平时使用哪种编程语言">
          </div>
        </div>

        <div id="options-box">
          <label>选项</label>
          <div id="option-rows"></div>
          <button type="button" class="secondary" id="add-option">增加选项</button>
          <div class="hint">编号供跳转规则使用；只改文字不会影响编号。</div>
        </div>

        <div id="multiple-box" class="row" hidden>
          <div class="field">
            <label>最少选择数量（留空不限）</label>
            <input type="number" name="minSelect" min="0" step="1">
          </div>
          <div class="field">
            <label>最多选择数量（留空不限）</label>
            <input type="number" name="maxSelect" min="0" step="1">
          </div>
        </div>

        <div id="text-box" class="row" hidden>
          <div class="field">
            <label>最少字数（留空不限）</label>
            <input type="number" name="minLength" min="0" step="1">
          </div>
          <div class="field">
            <label>最多字数（留空不限）</label>
            <input type="number" name="maxLength" min="0" step="1">
          </div>
        </div>

        <div id="number-box" class="row" hidden>
          <div class="field">
            <label>最小值（留空不限）</label>
            <input type="number" name="min" step="any">
          </div>
          <div class="field">
            <label>最大值（留空不限）</label>
            <input type="number" name="max" step="any">
          </div>
          <div class="field">
            <label>数值要求</label>
            <label style="font-weight:normal;"><input type="checkbox" name="integer"> 必须是整数</label>
          </div>
        </div>

        <div class="field" style="margin-top:14px;">
          <label>修改说明（可以不填）</label>
          <input type="text" name="changeNote" maxlength="200" placeholder="例如：把选项里的“其他”改得更具体">
        </div>

        <div style="margin-top:16px;">
          <button type="submit" id="save-question">保存</button>
          <span id="question-msg" class="error"></span>
        </div>
      </form>
    </div>

    <div class="card" id="detail-card" hidden>
      <div class="q-head">
        <div>
          <h2 id="detail-title" style="margin:0;">题目详情</h2>
          <div class="muted" id="detail-meta" style="margin-top:6px;"></div>
        </div>
        <button type="button" class="secondary" id="close-detail">收起</button>
      </div>

      <div class="split" style="margin-top:16px;">
        <div>
          <div class="sub-block">
            <h3>版本历史</h3>
            <div class="hint" style="margin-top:0;margin-bottom:8px;">箭头表示新版本是从哪一版改出来的。恢复旧版本也会记成一个新版本。</div>
            <div id="version-list"></div>
          </div>
        </div>

        <div>
          <div class="sub-block">
            <h3>使用情况</h3>
            <div id="usage-list"></div>
          </div>

          <div class="sub-block" id="share-block">
            <h3>共享</h3>
            <div id="share-list" class="muted" style="font-size:13px;"></div>
            <form id="share-form" class="inline-form" style="margin-top:8px;">
              <div class="field" style="flex:1;">
                <input type="text" name="username" placeholder="对方的用户名" maxlength="20">
              </div>
              <button type="submit" class="secondary">共享</button>
            </form>
            <div id="share-msg" class="error"></div>
          </div>

          <div class="sub-block" id="bank-add-block">
            <h3>加入题库</h3>
            <div class="inline-form">
              <div class="field" style="flex:1;">
                <select id="bank-select"></select>
              </div>
              <button type="button" class="secondary" id="add-to-bank">加入</button>
            </div>
            <div id="bank-msg" class="hint"></div>
          </div>
        </div>
      </div>

      <div class="sub-block">
        <h3>跨问卷统计</h3>
        <div class="hint" style="margin-top:0;margin-bottom:10px;">只汇总你自己名下问卷的回答。同一道题的不同版本会按选项文字合并。</div>
        <div id="stats-box"><div class="muted">加载中...</div></div>
      </div>
    </div>

    <div class="card">
      <div class="q-head">
        <div>
          <h2 style="margin:0;">题库</h2>
          <div class="muted" style="margin-top:6px;">把常考的题归到一起，出卷时可以整组挑选。</div>
        </div>
      </div>

      <form id="bank-form" class="inline-form" style="margin-top:14px;">
        <div class="field" style="flex:1;">
          <label>题库名称</label>
          <input type="text" name="name" maxlength="40" placeholder="例如：课程评价常用题" required>
        </div>
        <div class="field" style="flex:2;">
          <label>说明（可以不填）</label>
          <input type="text" name="description" maxlength="200">
        </div>
        <button type="submit">新建题库</button>
      </form>
      <div id="bank-msg-global" class="error"></div>

      <div id="bank-list" style="margin-top:16px;"></div>
      <div id="bank-detail" style="margin-top:16px;" hidden>
        <h3 id="bank-detail-title" style="font-size:14px;margin:0 0 8px;"></h3>
        <div id="bank-items"></div>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/questions.js"></script>
</body>
</html>
